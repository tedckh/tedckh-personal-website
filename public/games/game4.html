<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>針灸證治＋操作記憶卡 · 執業試溫習遊戲</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2230; --panel2:#222d40; --line:#2e3b52;
    --txt:#e7eef7; --muted:#94a3b8; --accent:#ff7a59; --accent2:#5ec1a8;
    --gold:#f5c451; --blue:#5aa9e6; --purple:#b794f6; --red:#f06a6a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1c2737,#0f1419 60%);color:var(--txt);min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
  header{text-align:center;padding:8px 0 4px}
  h1{font-size:22px;margin:0;letter-spacing:1px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}

  .stats{display:flex;gap:8px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--muted)}
  .chip b{color:var(--gold);font-size:15px}
  .chip.ok b{color:var(--accent2)} .chip.no b{color:var(--red)}

  .cats{display:flex;gap:6px;overflow-x:auto;padding:10px 2px;margin-bottom:6px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:18px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
  .cat.active{background:linear-gradient(135deg,var(--accent),#ff9a76);color:#1a1209;border-color:transparent;font-weight:700}

  .progress{height:6px;background:var(--panel);border-radius:6px;overflow:hidden;margin:6px 2px 14px}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--blue));width:0;transition:.3s}

  .card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);padding:22px 20px;min-height:380px;
    display:flex;flex-direction:column;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 80% 0%,rgba(255,122,89,.08),transparent 60%);pointer-events:none}
  .badge{align-self:flex-start;font-size:12px;color:var(--muted);background:#0e1622;border:1px solid var(--line);
    border-radius:14px;padding:4px 10px;margin-bottom:4px}
  .disease{font-size:29px;font-weight:800;letter-spacing:1px;margin:6px 0 2px}
  .zheng{font-size:19px;color:var(--gold);font-weight:700;margin-bottom:2px}
  .layers{margin-top:14px;display:flex;flex-direction:column;gap:11px;flex:1}

  .layer{border-radius:14px;border:1px dashed var(--line);background:#0e1622aa;overflow:hidden;transition:.2s}
  .layer .lh{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;color:var(--muted);cursor:pointer}
  .layer .lh .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);flex:0 0 22px}
  .layer .body{padding:0 14px;max-height:0;opacity:0;transition:max-height .35s ease,opacity .25s,padding .25s;overflow:auto}
  .layer.open{border-style:solid}
  .layer.open .body{max-height:420px;opacity:1;padding:0 14px 14px}
  .layer.open .lh{color:var(--txt)}
  .layer.open .ico{background:var(--accent2);border-color:transparent;color:#06231b}
  .layer.locked{opacity:.45}
  .layer.locked .lh{cursor:not-allowed}

  .l-zhifa.open{box-shadow:inset 0 0 0 1px var(--blue)}
  .l-zhifa .val{font-size:19px;color:var(--blue);font-weight:700;line-height:1.5}
  .l-jing.open{box-shadow:inset 0 0 0 1px var(--purple)}
  .l-jing .val{font-size:18px;color:var(--purple);font-weight:700;line-height:1.6}
  .l-fang.open{box-shadow:inset 0 0 0 1px var(--accent)}
  .l-fang .zhu{font-size:21px;color:var(--accent);font-weight:800;letter-spacing:1px;line-height:1.6}
  .l-fang .pei{margin-top:8px;font-size:14.5px;color:var(--txt);line-height:1.7}
  .l-fang .pei b{color:var(--gold)}
  .l-yao .loc{font-size:14.5px;line-height:1.8}
  .l-yao .loc b{color:var(--accent2)}
  .l-op .opbody{font-size:14.5px;line-height:1.8;white-space:pre-line}

  .tap-hint{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

  .controls{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:active{transform:scale(.97)}
  .btn.reveal{background:linear-gradient(135deg,var(--accent),#ff9a76);color:#1a1209}
  .btn.no{background:#3a2330;color:var(--red);border:1px solid #5a2f3f}
  .btn.ok{background:#1f3a32;color:var(--accent2);border:1px solid #2f5a4d}
  .nav{display:flex;gap:10px;margin-top:10px}
  .nav .btn{background:var(--panel);color:var(--muted);border:1px solid var(--line);font-size:14px;padding:11px}

  .toolbar{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .tool{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:12px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .tool:active{background:var(--panel)}

  .done{text-align:center;padding:40px 20px}
  .done .big{font-size:46px;margin-bottom:8px}
  .done h2{margin:6px 0}
  footer{text-align:center;color:#5b6677;font-size:11px;margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>針灸證治 ＋ 操作 · 記憶卡</h1>
    <div class="sub">香港中醫執業試溫習 · 依針灸Enotes（七版為主）· 逐層翻牌</div>
  </header>

  <div class="stats">
    <span class="chip">進度 <b id="s-pos">0</b>/<span id="s-total">0</span></span>
    <span class="chip ok">識得 <b id="s-ok">0</b></span>
    <span class="chip no">要溫 <b id="s-no">0</b></span>
  </div>

  <div class="cats" id="cats"></div>
  <div class="progress"><i id="bar"></i></div>

  <div id="cardArea"></div>

  <div class="toolbar">
    <button class="tool" id="t-shuffle">🔀 隨機洗牌</button>
    <button class="tool" id="t-review">⚠️ 只溫「要溫」</button>
    <button class="tool" id="t-reset">↺ 重新開始</button>
  </div>

  <footer>
    內容依《針灸學》教材及針灸Enotes、刺灸操作筆記整理。<br>
    臨證以教材原文為準；如有疑問請核對課本。祝 Alex 考試順利 🌿
  </footer>
</div>

{d:"得氣",s:[
["定義","亦稱「針感」，是指將針刺入腧穴後所產生的經氣感應。"],
["得氣感覺","1. 醫者：感到針下有徐和或沉緊的感覺。\n2. 患者：針下出現痠、麻、脹、重等感覺，甚或沿一定部位、向一定方向擴散傳導。"],
["意義","1. 治療效果：得氣迅速療效較好；得氣較慢效果較差；不得氣時可能無效。\n2. 預後：「氣速至而速效，氣遲至而不治」——如終不至者，不可治也。"],
["不得氣原因與催氣方法","1. 醫者：取穴不準確、手法運用不當、針刺角度有誤、深淺失度。→ 重新調整腧穴針刺部位、角度、深度，運用必要手法再次行針。\n2. 患者：久病體虛、正氣虛憊以致經氣不足；或感覺遲鈍。→ 行針催氣、留針候氣、溫針或加艾灸以助經氣。\n3. 若用上法仍不得氣者，多為臟腑經絡之氣虛衰已極。"]]},
{d:"行針基本手法",s:[
["分類","提插法、捻轉法。"],
["操作方法","1. 提插法：刺入一定深度後，進行上、下進退的操作。針由淺層向下刺入深層為「插」，由深層向上退到淺層為「提」。\n2. 捻轉法：刺入一定深度後，以右手拇指和中、食二指持住針柄，進行一前一後的來回旋轉捻動。"]]},
{d:"行針輔助手法",s:[
["分類","循法、刮柄法、彈柄法、搓柄法、搖柄法、震顫法。"],
["操作方法","1. 循法：以手於腧穴周圍或沿經脈循行部位徐和地循按或循攝。（未得氣：行氣催氣；針下過於沉緊：宣散氣血，使針下徐和）\n2. 刮柄法：拇指或食指指腹抵住針尾，用指甲由下而上頻頻刮動針柄。（激發經氣，促使得氣）\n3. 彈柄法：以手指輕輕叩彈針柄，使針身產生輕微震動。（催氣，使經氣速行）\n4. 搓柄法：以拇、食、中三指持針柄向單一方向捻轉，如搓線狀，每搓2-3周，與提插配合以免肌纖維纏針。（行氣、催氣、補虛瀉實）\n5. 搖柄法：手持針柄搖動，如搖櫓狀。直立針身而搖→出針瀉邪；卧針斜刺而搖→針感單向傳導。（行氣）\n6. 震顫法：小幅度、快頻率的提插捻轉，使針身輕微震顫。（促使得氣，增強袪邪扶正）"]]},
{d:"捻轉補瀉",s:[
["操作方法","得氣後施行。\n補法：捻轉角度小，用力輕，頻率慢，時間短；左轉時角度大、用力重。\n瀉法：捻轉角度大，用力重，頻率快，時間長；右轉時角度大、用力重。"]]},
{d:"提插補瀉",s:[
["操作方法","得氣後施行。\n補法：先淺後深，重插輕提，幅度小，頻率慢，時間短。\n瀉法：先深後淺，輕插重提，幅度大，頻率快，時間長。"]]},
{d:"疾徐補瀉",s:[
["操作方法","補法：徐徐進針，少捻轉，疾速出針。\n瀉法：疾速進針，多捻轉，徐徐出針。"]]},
{d:"迎隨補瀉",s:[
["操作方法","補法：針尖隨着經脈循行「去」的方向刺入。\n瀉法：針尖迎着經脈循行「來」的方向刺入。"]]},
{d:"呼吸補瀉",s:[

{d:"開闔補瀉",s:[
["操作方法","補法：出針後迅速揉按針孔。\n瀉法：出針時搖大針孔而不立即揉按。"]]},
{d:"平補平瀉",s:[

{d:"燒山火（複式補法）",s:[
["操作方法","將針刺入應刺深度的上1/3（天部），得氣後行捻轉補法；再將針刺入中1/3（人部），得氣後行捻轉補法；然後將針刺入下1/3（地部），得氣後行捻轉補法，將針提到上1/3。如此反覆三次，即將針緊按至地部留針。操作中配合呼吸補瀉的補法。"],
["用途","治療冷痹頑麻、虛寒性疾病。"]]},
{d:"透天涼（複式瀉法）",s:[
["操作方法","將針刺入應刺深度的下1/3（地部），得氣後行捻轉瀉法；再將針緊提至中1/3（人部），得氣後行捻轉瀉法；然後將針緊提至上1/3（天部），得氣後行捻轉瀉法，將針緩按至下1/3。如此反覆三次，即將針緊提至上1/3留針。操作中配合呼吸補瀉的瀉法。"],
["用途","治療熱痹、急性癰腫等實熱性疾病。"]]},
{d:"暈針",s:[
["定義","在針刺過程中，病人發生的暈厥現象。"],
["原因","1. 患者體質虛弱、精神緊張、疲勞、飢餓、大汗、大瀉、大出血之後，或體位不當。\n2. 醫者針刺時手法過重。"],
["症狀","突然精神疲倦、頭暈目眩、面色蒼白、噁心欲吐、多汗、心慌、四肢發冷、血壓下降、脈沉細；或神志昏迷、仆倒在地、唇甲青紫、二便失禁、脈微細欲絕。"],
["處理","1. 立即停止針刺，將針全部取出。\n2. 使患者平卧，注意保暖；輕者仰臥片刻，給飲溫開水或糖水後即可恢復。\n3. 重者可加刺人中、素髎、內關、足三里，灸百會、關元、氣海。\n4. 若仍昏迷不醒，配合其他治療或採取急救。"],
["預防","1. 初次針刺或精神緊張、身體虛弱者，先做好解釋，消除顧慮。\n2. 選擇舒適體位（最好卧位），選穴宜少，手法要輕。\n3. 飢餓、疲勞、大渴時，先進食、休息、飲水後再針刺。\n4. 針刺過程中注意觀察病人神色、詢問感覺，一旦有暈針先兆即時處理。"]]},
{d:"滯針",s:[
["定義","行針時或留針後，醫者感覺針下澀滯，捻轉、提插、出針均感困難，而病人感到痛劇。"],
["原因","1. 患者精神緊張，針刺入後局部肌肉強烈收縮。\n2. 行針手法不當，向單一方向捻轉太過，肌肉組織纏繞針體。\n3. 留針時間過長。"],
["症狀","針在體內捻轉不動，提插、出針均困難；若勉強捻轉、提插，病人痛不可忍。"],
["處理","1. 因精神緊張、肌肉過度收縮：稍延長留針時間，或於附近循按、叩彈針柄，或在附近再刺一針，以宣散氣血、緩解肌肉緊張。\n2. 因行針不當（單向捻轉）：向相反方向將針捻回，並用刮柄、彈柄法使纏繞的肌纖維回釋。"],
["預防","1. 做好解釋工作，消除顧慮。\n2. 注意行針手法，避免單向捻轉；用搓法時應與提插法配合，避免肌纖維纏繞針體。"]]},
{d:"彎針",s:[
["定義","進針時或將針刺入腧穴後，針身在體內形成彎曲。"],
["原因","1. 醫者手法不熟練，用力過猛、過速，針尖碰到堅硬組織器官。\n2. 病人在針刺或留針時移動體位。\n3. 針柄受到外力的壓迫、碰擊等。"],
["症狀","針柄改變了進針或留針時的角度，提插、捻轉及出針均感困難，患者感到疼痛。"],
["處理","1. 出現彎針後，不得再行提插、捻轉等手法。\n2. 輕微彎曲者慢慢將針取出；彎曲角度過大時，順着彎曲的方向將針起出。\n3. 因體位改變引起者，囑患者慢慢恢復原來體位，局部肌肉放鬆後將針起出。\n4. 切忌強行拔針，以免針斷在體內。"],
["預防","1. 進針手法要熟練，指力均勻，避免過猛、過速。\n2. 選擇適當體位，留針時囑患者不要隨意更動體位。\n3. 保護針刺部位，針柄不得受外物碰撞和壓迫。"]]},
{d:"血腫",s:[
["定義","針刺部位出現皮下出血引起的腫痛。"],
["原因","1. 針尖彎曲帶鉤，使皮肉受損。\n2. 刺傷血管。"],
["症狀","出針後，針刺部位腫脹疼痛，繼則皮膚呈青紫色。"],
["處理","1. 微量皮下出血、局部小塊青紫：一般不必處理，可自行消退。\n2. 腫脹疼痛較劇、青紫面積大而影響活動：先冷敷止血，再做熱敷或局部輕輕揉按，促使瘀血消散吸收。"],
["預防","1. 仔細檢查針具。\n2. 熟悉人體解剖結構，避開血管針刺。\n3. 出針時立即用消毒乾棉球揉按壓迫針孔。"]]},
{d:"斷針",s:[
["定義","針體折斷在人體內。"],
["原因","1. 針具質量欠佳，針身或針根有損傷剝蝕，進針前失於檢查。\n2. 針刺時將針身全部刺入腧穴。\n3. 行針時強行捻轉、提插，肌肉猛烈收縮。\n4. 留針時患者改變體位。\n5. 彎針、滯針未能及時處理。"],
["症狀","行針時或出針後發現針身折斷，斷端部分針身尚露在皮膚外，或完全沒入皮膚之下。"],
["處理","1. 醫者保持鎮定，囑患者保持原有體位，以防斷針向深部陷入。\n2. 殘端露於體外：用手指或鑷子將針起出。\n3. 殘端與皮膚相平或陷於皮內：用左手拇食指垂直擠壓針孔兩旁，使殘端暴露，再用鑷子取出。\n4. 斷針完全深入皮下或肌肉深層：在X線定位下手術取出。"],
["預防","1. 檢查針具，不合格者剔出不用。\n2. 針刺時不可將針身全部刺入，應留部分於體外。\n3. 囑患者行針、留針時不可隨意改變體位。\n4. 避免過猛、過強行針。\n5. 出現彎針、滯針時切忌強行刺入、行針。"]]},
{d:"針刺注意事項",s:[
["注意事項","1. 過於飢餓、疲勞、精神緊張時，不宜立即針刺。\n2. 身體瘦弱、氣虛血弱者，手法不宜過強，盡量選用卧位。\n3. 懷孕婦女不宜針腹部、腰骶部穴位；三陰交、合谷、昆侖、至陰等通經活血穴位禁針。\n4. 除了調經，一般月經期不針刺。\n5. 小兒囟門未閉合時，頭頂部穴位不宜針刺。\n6. 常有自發性出血或損傷後出血不止者，不宜針刺。\n7. 皮膚感染、潰瘍、瘢痕或腫瘤部位不宜針刺。\n8. 胸、背、脅、腋、缺盆部腧穴不宜深刺，以免傷及內臟。\n9. 眼區穴、頸部風府、啞門及脊椎部穴位，注意掌握角度，不宜大幅度提插捻轉。\n10. 尿瀦留患者針刺小腹部時，注意針刺方向、角度和深度。"]]},
{d:"艾炷直接灸",s:[
["定義","將大小適宜的艾炷直接放在皮膚上施灸。"],
["分類","瘢痕灸（化膿灸）、無瘢痕灸。"],
["操作方法","【瘢痕灸】1. 先在穴位上塗少量大蒜汁，以增加黏附和刺激作用；2. 將艾炷置於穴位上點燃，直至艾炷燃盡；3. 除去灰燼，易炷再灸，至灸完規定壯數。（艾火燒灼可產生劇痛，可輕拍周圍緩解；灸後一周左右化膿形成灸瘡，5-6周自行痊癒，結痂脫落留下瘢痕）\n【無瘢痕灸】1. 穴位上塗少量凡士林使艾炷便於黏附；2. 點燃後當艾炷燃剩約1/4、患者微覺灼痛時，易炷再灸，至規定壯數；以局部皮膚紅暈而不起泡為度。"],
["用途","瘢痕灸：哮喘、肺癆、瘰癘等慢性疾病。無瘢痕灸：一般虛寒性疾病。"]]},
{d:"隔薑灸",s:[
["定義","艾炷間接灸之一：用藥物將艾炷與施灸腧穴部位的皮膚隔開施灸。"],
["操作方法","1. 用鮮薑切成厚約0.2-0.3cm的薄片，中間以針刺數孔。\n2. 將薑片放於穴位或患處，再將艾炷放在薑片上，點燃施灸。\n3. 待艾炷燒完，再易炷施灸，至灸完規定壯數。\n4. 以皮膚紅潤不起泡為度。"],
["用途","嘔吐、腹痛、腹瀉、風寒濕痹痛。"]]},
{d:"隔蒜灸",s:[
["操作方法","1. 用鮮大蒜頭切成厚約0.2-0.3cm的薄片，中間以針刺數孔（或搗成蒜泥）。\n2. 將蒜片放於穴位或患處，再將艾炷放在蒜片上，點燃施灸。\n3. 待艾炷燒完，再易炷施灸，至灸完規定壯數。"],
["用途","瘰癘、肺癆、初起腫瘍。"]]},
{d:"隔鹽灸",s:[
["操作方法","1. 用純淨的食鹽填敷於臍上（或於鹽上再放一薄薑片）。\n2. 上置大艾炷點燃施灸。\n3. 有回陽救逆固脫作用，需連續灸，不拘壯數，以期脈起、肢溫、證候改善。"],
["用途","傷寒陰證或吐瀉並作、中風脫證。"]]},
{d:"隔附子餅灸",s:[
["操作方法","1. 將附子研成細末，用酒調和做成直徑約3cm、厚約0.8cm的附子餅，中間以針刺數孔。\n2. 將附子餅放於穴位或患處，再將艾炷放在附子餅上，點燃施灸。\n3. 待艾炷燒完，再易炷施灸，至灸完規定壯數。"],
["用途","命門火衰而致的陽痿、早泄，瘡瘍久潰不斂。"]]},
{d:"艾條灸",s:[
["分類","溫和灸、雀啄灸（回旋灸）。"],
["操作方法","【溫和灸】1. 將艾條一端點燃，對準應灸的穴位或患處，約距皮膚2-3cm進行熏烤；2. 患者局部有溫熱感而無灼痛為宜，一般每處5-7分鐘，至皮膚紅暈；3. 對昏厥、局部知覺遲鈍者，醫者以中、食二指置於施灸部位兩側，藉手指感覺測知受熱程度，以防燙傷。\n【雀啄灸】艾條點燃的一端與施灸部位不固定距離，像鳥啄食般一上一下地施灸；亦可均勻地上下或左右移動或反覆旋轉施灸（回旋灸）。"],
["用途","溫和灸：多用於慢性疾病。雀啄灸：多用於急性疾病。"]]},
{d:"溫針灸",s:[
["操作方法","1. 將針刺入穴位，給予適當補瀉手法而留針。\n2. 將艾絨捏在針尾，或用一段長約2cm的艾條插在針柄上，點燃。\n3. 待艾絨或艾條燒完後除去灰燼，將針取出。"],
["用途","既需留針又適宜艾灸的病證。"]]},
{d:"燈草灸（燈火灸）",s:[
["操作方法","用麻油浸燈心草，燃着後對準應灸的穴位，猛一接觸聽到「叭」一聲迅速離開；若無爆焠聲可重複一次。"],
["用途","疏風解表、行氣化痰、清神止抽：小兒痄腮、臍風、胃痛、腹痛、痧脹。"]]},
{d:"白芥子灸（天灸）",s:[
["操作方法","即「天灸」之類。1. 將白芥子研成粉末，用水調和，敷於應灸的穴位上。\n2. 利用其較強的刺激，敷貼後促使發泡，以達到治療目的。"],
["用途","關節痹痛、口眼喎斜、哮喘（配合其他藥物）。"]]},
{d:"艾灸注意事項·補瀉·禁忌·灸後處理",s:[
["注意事項（先後次序）","先上後下，先陽後陰，先少後多（壯數），先小後大（艾炷）。"],
["灸法補瀉","以火補之，毋吹其火，須自滅也（補）。\n以火瀉之，疾吹其火，傳其艾，須其火滅也（瀉）。"],
["禁忌","1. 實熱證、陰虛發熱者，不適宜灸。\n2. 顏面、五官、大血管部位、關節活動部位，不宜瘢痕灸。\n3. 孕婦腹部和腰骶部不宜灸。"],
["灸後處理","1. 局部微紅灼熱屬正常，無須處理。\n2. 出現小水泡，勿擦破，任其自然吸收。\n3. 水泡較大者，用消毒毫針刺破放出水液，塗龍膽紫，紗布包裹。\n4. 瘢痕灸化膿期注意休息、加強營養、保持清潔，用敷料保護灸瘡待自然癒合；如膿液呈黃綠色或滲血，可用消毒藥膏或玉紅膏塗敷。"]]},
{d:"拔罐法",s:[
["分類","火罐（閃火法）、走罐、閃罐、刺絡拔罐。"],
["操作方法","【火罐·閃火法】用鑷子夾住酒精棉球點燃，使火在罐內繞1-3周後退出，迅速將罐扣在應拔部位，即可吸附在皮膚上。\n【走罐】先在所拔部位皮膚塗一層凡士林等潤滑油，將罐拔住後握住罐子，向上下或左右往返推動，至皮膚紅潤、充血甚至瘀血時將罐起下。（適用肌肉豐厚部位）\n【閃罐】將罐拔住後立即起下，反覆多次地拔住起下，直至皮膚潮紅、充血或瘀血為度。\n【刺絡拔罐】皮膚消毒後，用三棱針點刺出血或皮膚針叩打後再行拔罐，以加強刺血治療作用。"],
["作用與適應範圍","作用：通經活絡、行氣活血、消腫止痛、袪風散寒。\n範圍：風濕痹證、腰背肩臂腿痛、關節痛、軟組織閃挫傷、傷風感冒、頭痛、咳嗽、哮喘、胃脘痛、嘔吐、腹痛、泄瀉、痛經、中風偏枯等。"],
["注意事項","1. 選擇適當體位和肌肉豐厚的部位；體位不當、移動、骨骼凹凸不平、毛髮較多處不適合。\n2. 根據部位面積大小選擇大小適宜的罐。\n3. 操作必須迅速，才能使罐拔緊、吸附有力。\n4. 用火罐時勿灼傷或燙傷皮膚。\n5. 皮膚過敏、潰瘍、水腫及大血管部位不宜拔罐。\n6. 高熱抽搐者、孕婦腹部及腰骶部不宜拔罐。"]]},
{d:"三棱針",s:[
["分類","點刺法、散刺法、刺絡法。"],
["操作方法","【點刺法】點刺腧穴放出少量血液或擠出少量體液：1. 針刺部位上下推按，使血液積聚；2. 消毒；3. 以拇、食、中指捏住針刺部位；4. 右手持針對準部位刺入3-5mm，迅速退針；5. 輕擠針孔周圍出血少許，消毒乾棉球按壓。（多用於十宣、十二井穴、耳尖及頭面部攢竹、上星、太陽）\n【散刺法】對病變局部周圍進行點刺，由外緣環形向中心點刺，促使瘀血或水腫排除，袪瘀生新、通經活絡。（多用於局部瘀血、血腫、水腫、頑癬）\n【刺絡法】刺入淺表血絡或靜脈放出少量血液：1. 橡皮管結扎針刺部位上端，消毒；2. 左手拇指壓住下端；3. 對準靜脈刺入2-3mm，迅速退針；4. 出血少許後棉球按壓。（多用於曲澤、委中，治急性吐瀉、中暑、發熱）"],
["作用與適應範圍","作用：通經活絡、開竅瀉熱、消腫止痛。\n範圍：實證、熱證、瘀血、疼痛等——昏厥、高熱、中暑、中風閉證、咽喉腫痛、目赤腫痛、頑癬、扭挫傷、疳證、痔瘡、頑痹、頭痛、丹毒、指（趾）麻木等。"],
["注意事項","1. 做好解釋，消除思想顧慮。\n2. 嚴格消毒，防止感染。\n3. 點刺手法要輕、穩、準、快，不可用力過猛，防止刺入過深；出血不宜太多，勿傷動脈。\n4. 體虛、孕婦、產後、有出血傾向者不宜使用。\n5. 注意體位舒適，防止暈針。"]]},
{d:"皮膚針（梅花針）",s:[
["定義","叩刺人體一定部位，激發經絡功能，調整臟腑氣血。"],
["操作方法","1. 針具和叩刺部位消毒。\n2. 右手握針柄，以無名指、小指將針柄末端固定於小魚際處，拇、中、食指扶持針柄。\n3. 運用腕部彈力，使針尖叩刺皮膚後立即彈起，反覆進行。\n4. 叩擊時針尖與皮膚垂直，彈刺準確，強度均勻。"],
["注意事項","1. 經常檢查針具，注意針尖有無毛鉤、針面是否平齊。\n2. 動作輕捷、正直無偏斜，以免造成疼痛。\n3. 局部有潰瘍或損傷者不宜使用；急性傳染病和急腹症不能用。\n4. 叩刺後有出血者應消毒，防止感染。\n5. 滾刺筒不要在骨骼突出部位滾動，以免疼痛或出血。"]]},
{d:"耳針",s:[
["分類","毫針法、壓丸法。"],
["操作方法","【毫針法】1. 消毒選定耳穴點（探棒或探測儀測得的敏感點）；2. 左手拇食指固定耳廓，中指托住針刺部的耳背；3. 右手持針，快速插入（速刺）或慢慢捻入（慢刺）；4. 一般刺入2-3mm，達軟骨後毫針站立不搖晃為準；5. 出針時左手托住耳廓，右手迅速垂直拔出；6. 消毒乾棉球按壓針孔，以免出血。\n【壓丸法】一般用王不留行子，貼在0.6×0.6cm膠布中間，用鑷子夾住貼敷於選用耳穴上，每日自行按壓3-5次，每次30-60秒，3-7日更換一次。"],
["注意事項","1. 嚴格消毒，防止感染。\n2. 扭傷和運動障礙患者，進針後適當活動患部，有助提高療效。\n3. 有習慣性流產的孕婦應禁針。\n4. 嚴重器質性病變和高度貧血者不宜針刺；嚴重心臟病、高血壓者不宜行強刺激法。\n5. 防止暈針，一旦發生及時處理。"]]}
];

/* ---------- 合併為統一卡組 ---------- */
OPS.forEach(o=>{ DATA.push({c:"刺灸操作", d:o.d, z:"", op:true, s:o.s}); });

/* ---------- 遊戲邏輯 ---------- */
const DZ_LAYERS=[
  {key:"f", cls:"l-zhifa", icon:"治", title:"治法"},
  {key:"j", cls:"l-jing",  icon:"經", title:"所用經絡"},
  {key:"xue", cls:"l-fang", icon:"穴", title:"選穴（主穴 · 配穴）"},
  {key:"loc", cls:"l-yao", icon:"取", title:"取穴方法（主穴定位）"}
];
const cats = ["全部", ...Array.from(new Set(DATA.map(x=>x.c)))];
let state = { cat:"全部", order:[], idx:0, stage:0, marks:{}, reviewMode:false };

function layersFor(it){
  if(it.op) return it.s.map((sec,i)=>({key:"op"+i, cls:"l-op", icon:String(i+1), title:sec[0], body:sec[1]}));
  return DZ_LAYERS;
}
function indicesForCat(cat){
  let arr = DATA.map((x,i)=>i).filter(i=> cat==="全部" || DATA[i].c===cat);
  if(state.reviewMode) arr = arr.filter(i=> state.marks[i]==="no");
  return arr;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildCats(){
  const wrap=document.getElementById("cats"); wrap.innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="cat"+(c===state.cat?" active":"");
    const n = c==="全部"?DATA.length:DATA.filter(x=>x.c===c).length;
    b.textContent=`${c}·${n}`;
    b.onclick=()=>{state.cat=c;state.reviewMode=false;startDeck();};
    wrap.appendChild(b);
  });
}
function startDeck(){
  state.order = indicesForCat(state.cat);
  state.idx=0; state.stage=0;
  buildCats(); render();
}
function setStats(){
  const ok=Object.values(state.marks).filter(v=>v==="ok").length;
  const no=Object.values(state.marks).filter(v=>v==="no").length;
  document.getElementById("s-ok").textContent=ok;
  document.getElementById("s-no").textContent=no;
  document.getElementById("s-pos").textContent=Math.min(state.idx+1,state.order.length);
  document.getElementById("s-total").textContent=state.order.length;
  const pct=state.order.length? (state.idx/state.order.length*100):0;
  document.getElementById("bar").style.width=pct+"%";
}
function esc(t){return (t||"").replace(/\n/g,"<br>");}
function render(){
  const area=document.getElementById("cardArea");
  if(state.order.length===0){
    area.innerHTML=`<div class="card"><div class="done"><div class="big">🎉</div><h2>冇卡喇！</h2><p class="sub">呢個分類／「要溫」清單已清空。</p></div></div>`;
    setStats(); return;
  }
  if(state.idx>=state.order.length){
    const ok=Object.values(state.marks).filter(v=>v==="ok").length;
    area.innerHTML=`<div class="card"><div class="done">
      <div class="big">🏆</div><h2>完成呢副牌！</h2>
      <p class="sub">已過 ${state.order.length} 張卡 · 標記識得 ${ok} 張</p>
      <div class="controls" style="margin-top:22px">
        <button class="btn ok" onclick="state.idx=0;state.stage=0;render()">↺ 再嚟一次</button>
        <button class="btn no" onclick="state.reviewMode=true;startDeck()">⚠️ 集中溫「要溫」</button>
      </div></div></div>`;
    setStats(); return;
  }
  const it=DATA[state.order[state.idx]];
  const gi=state.order[state.idx];
  const LAYERS=layersFor(it);
  let layersHTML="";
  LAYERS.forEach((L,li)=>{
    const open = state.stage>li;
    const locked = state.stage<li;
    let val="";
    if(it.op){
      val=`<div class="opbody">${L.body}</div>`;
    }else{
      if(L.key==="f") val=`<div class="val">${it.f}</div>`;
      if(L.key==="j") val=`<div class="val">${it.j}</div>`;
      if(L.key==="xue") val=`<div class="zhu">${it.zhu.join("、")}</div>`+(it.pei?`<div class="pei">${it.pei}</div>`:"");
      if(L.key==="loc"){
        val=`<div class="loc">`+it.zhu.map(p=>`<b>${p}</b>：${POINTS[p]||"（見教材定位）"}`).join("<br>")+`</div>`;
      }
    }
    layersHTML+=`<div class="layer ${L.cls} ${open?'open':''} ${locked?'locked':''}" data-li="${li}">
      <div class="lh"><span class="ico">${open?'✓':L.icon}</span>${L.title}${locked?' <span style="margin-left:auto;font-size:11px">🔒</span>':''}</div>
      <div class="body">${val}</div></div>`;
  });
  const fullyRevealed = state.stage>=LAYERS.length;
  area.innerHTML=`
    <div class="card" id="theCard">
      <span class="badge">${it.c}</span>
      <div class="disease">${it.d}</div>
      ${it.z?`<div class="zheng">${it.z}</div>`:``}
      <div class="layers">${layersHTML}</div>
      ${!fullyRevealed?`<div class="tap-hint">👆 撳卡／撳掣 逐層揭開</div>`:``}
    </div>
    <div class="controls">
      ${!fullyRevealed
        ? `<button class="btn reveal" id="revealBtn">揭開：${LAYERS[state.stage].title} ▾</button>`
        : `<button class="btn no" id="markNo">⚠️ 要再溫</button>
           <button class="btn ok" id="markOk">✓ 識得</button>`}
    </div>
    <div class="nav">
      <button class="btn" onclick="prevCard()">◀ 上一張</button>
      <button class="btn" onclick="nextCard()">下一張 ▶</button>
    </div>`;

  const card=document.getElementById("theCard");
  const total=LAYERS.length;
  card.onclick=(e)=>{ if(e.target.closest('.layer')) return; if(state.stage<total){state.stage++;render();} };
  card.querySelectorAll('.layer').forEach(el=>{
    el.querySelector('.lh').onclick=(ev)=>{ev.stopPropagation();
      const li=+el.dataset.li;
      if(li===state.stage){state.stage++;render();}
    };
  });
  const rb=document.getElementById("revealBtn"); if(rb) rb.onclick=()=>{state.stage++;render();};
  const mo=document.getElementById("markOk"); if(mo) mo.onclick=()=>{state.marks[gi]="ok";nextCard();};
  const mn=document.getElementById("markNo"); if(mn) mn.onclick=()=>{state.marks[gi]="no";nextCard();};
  setStats();
}
function nextCard(){ state.idx++; state.stage=0; render(); }
function prevCard(){ if(state.idx>0){state.idx--; state.stage=0; render();} }

document.getElementById("t-shuffle").onclick=()=>{shuffle(state.order);state.idx=0;state.stage=0;render();};
document.getElementById("t-review").onclick=()=>{
  const noCount=Object.values(state.marks).filter(v=>v==="no").length;
  if(noCount===0){alert("仲未標記過「要再溫」嘅卡 😊");return;}
  state.reviewMode=true; startDeck();
};
document.getElementById("t-reset").onclick=()=>{
  if(confirm("重新開始？會清除「識得／要溫」標記。")){state.marks={};state.reviewMode=false;startDeck();}
};

document.addEventListener("keydown",e=>{
  const it=DATA[state.order[state.idx]]; if(!it) return;
  const total=layersFor(it).length;
  if(e.key==="ArrowRight"||e.key===" "){
    if(state.stage<total){state.stage++;render();}else nextCard(); e.preventDefault();
  }else if(e.key==="ArrowLeft"){prevCard();}
});

buildCats(); startDeck();
</script>
</body>
</html>
