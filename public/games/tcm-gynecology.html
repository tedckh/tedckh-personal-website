<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a2230;
        --panel2: #222d40;
        --line: #2e3b52;
        --txt: #e7eef7;
        --muted: #94a3b8;
        --accent: #ff7a59;
        --accent2: #5ec1a8;
        --gold: #f5c451;
        --blue: #5aa9e6;
        --purple: #b794f6;
        --red: #f06a6a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family:
          "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui,
          sans-serif;
        background: radial-gradient(
          1200px 600px at 50% -10%,
          #1c2737,
          #0f1419 60%
        );
        color: var(--txt);
        min-height: 100vh;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px 14px 60px;
      }
      header {
        text-align: center;
        padding: 8px 0 4px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: 1px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }

      /* stats bar */
      .stats {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 14px 0 6px;
        flex-wrap: wrap;
      }
      .chip {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 6px 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .chip b {
        color: var(--gold);
        font-size: 15px;
      }
      .chip.ok b {
        color: var(--accent2);
      }
      .chip.no b {
        color: var(--red);
      }

      /* category tabs */
      .cats {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 10px 2px;
        margin-bottom: 6px;
        scrollbar-width: none;
      }
      .cats::-webkit-scrollbar {
        display: none;
      }
      .cat {
        flex: 0 0 auto;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 18px;
        padding: 7px 14px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition: 0.15s;
      }
      .cat.active {
        background: linear-gradient(135deg, var(--accent), #ff9a76);
        color: #1a1209;
        border-color: transparent;
        font-weight: 700;
      }

      /* progress */
      .progress {
        height: 6px;
        background: var(--panel);
        border-radius: 6px;
        overflow: hidden;
        margin: 6px 2px 14px;
      }
      .progress > i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--accent2), var(--blue));
        width: 0;
        transition: 0.3s;
      }

      /* card */
      .card {
        background: linear-gradient(160deg, var(--panel), var(--panel2));
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 22px 20px;
        min-height: 380px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          400px 200px at 80% 0%,
          rgba(255, 122, 89, 0.08),
          transparent 60%
        );
        pointer-events: none;
      }
      .badge {
        align-self: flex-start;
        font-size: 12px;
        color: var(--muted);
        background: #0e1622;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 4px 10px;
        margin-bottom: 4px;
      }
      .disease {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 1px;
        margin: 6px 0 2px;
      }
      .zheng {
        font-size: 20px;
        color: var(--gold);
        font-weight: 700;
        margin-bottom: 2px;
      }
      .layers {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
      }

      .layer {
        border-radius: 14px;
        border: 1px dashed var(--line);
        background: #0e1622aa;
        overflow: hidden;
        transition: 0.2s;
      }
      .layer .lh {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 14px;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
      }
      .layer .lh .ico {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .layer .body {
        padding: 0 14px;
        max-height: 0;
        opacity: 0;
        transition:
          max-height 0.35s ease,
          opacity 0.25s,
          padding 0.25s;
      }
      .layer.open {
        border-style: solid;
      }
      .layer.open .body {
        max-height: 400px;
        opacity: 1;
        padding: 0 14px 14px;
      }
      .layer.open .lh {
        color: var(--txt);
      }
      .layer.open .ico {
        background: var(--accent2);
        border-color: transparent;
        color: #06231b;
      }
      .layer.locked {
        opacity: 0.45;
      }
      .layer.locked .lh {
        cursor: not-allowed;
      }

      .l-def.open {
        box-shadow: inset 0 0 0 1px var(--purple);
      }
      .l-def .deftxt {
        font-size: 15px;
        line-height: 1.75;
      }
      .l-def .deftxt b {
        color: var(--purple);
      }
      .l-def .ji {
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.75;
      }
      .l-def .ji b {
        color: var(--accent2);
      }
      .l-zhifa.open {
        box-shadow: inset 0 0 0 1px var(--blue);
      }
      .l-zhifa .val {
        font-size: 19px;
        color: var(--blue);
        font-weight: 700;
      }
      .l-fang.open {
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .l-fang .val {
        font-size: 24px;
        color: var(--accent);
        font-weight: 800;
        letter-spacing: 1px;
      }
      .l-yao .compose {
        font-size: 16px;
        line-height: 1.7;
      }
      .l-yao .jue {
        margin-top: 10px;
        padding: 10px 12px;
        background: #13283f;
        border-left: 3px solid var(--gold);
        border-radius: 8px;
        color: var(--gold);
        font-size: 15px;
        line-height: 1.7;
        font-weight: 600;
      }
      .l-yao .jue small {
        color: var(--muted);
        font-weight: 400;
      }

      .tap-hint {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin-top: 8px;
        animation: blink 1.6s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      /* controls */
      .controls {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .btn {
        flex: 1;
        border: none;
        border-radius: 14px;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.15s;
        font-family: inherit;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn.reveal {
        background: linear-gradient(135deg, var(--accent), #ff9a76);
        color: #1a1209;
      }
      .btn.no {
        background: #3a2330;
        color: var(--red);
        border: 1px solid #5a2f3f;
      }
      .btn.ok {
        background: #1f3a32;
        color: var(--accent2);
        border: 1px solid #2f5a4d;
      }
      .nav {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .nav .btn {
        background: var(--panel);
        color: var(--muted);
        border: 1px solid var(--line);
        font-size: 14px;
        padding: 11px;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .tool {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 12px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .tool:active {
        background: var(--panel);
      }

      .done {
        text-align: center;
        padding: 40px 20px;
      }
      .done .big {
        font-size: 46px;
        margin-bottom: 8px;
      }
      .done h2 {
        margin: 6px 0;
      }
      .hidden {
        display: none;
      }
      footer {
        text-align: center;
        color: #5b6677;
        font-size: 11px;
        margin-top: 24px;
        line-height: 1.6;
      }
    </style>
  </head>

      <div class="progress"><i id="bar"></i></div>

      <div id="cardArea"></div>

    </div>

      /* ---------- 遊戲邏輯 ---------- */
      const LAYER_DEFS = [
        { key: "def", cls: "l-def", icon: "義", title: "定義 · 總病機" },
        { key: "f", cls: "l-zhifa", icon: "治", title: "治法" },
        { key: "r", cls: "l-fang", icon: "方", title: "用方" },
        { key: "yao", cls: "l-yao", icon: "藥", title: "藥物組成" },
      ];
      const cats = ["全部", ...Array.from(new Set(DATA.map((x) => x.c)))];
      let state = {
        cat: "全部",
        order: [],
        idx: 0,
        stage: 0,
        marks: {},
        reviewMode: false,
      };

      function indicesForCat(cat) {
        let arr = DATA.map((x, i) => i).filter(
          (i) => cat === "全部" || DATA[i].c === cat,
        );
        if (state.reviewMode) arr = arr.filter((i) => state.marks[i] === "no");
        return arr;
      }
      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildCats() {
        const wrap = document.getElementById("cats");
        wrap.innerHTML = "";
        cats.forEach((c) => {
          const b = document.createElement("button");
          b.className = "cat" + (c === state.cat ? " active" : "");
          const n =
            c === "全部" ? DATA.length : DATA.filter((x) => x.c === c).length;
          b.textContent = `${c}·${n}`;
          b.onclick = () => {
            state.cat = c;
            state.reviewMode = false;
            startDeck();
          };
          wrap.appendChild(b);
        });
      }
      function startDeck() {
        state.order = indicesForCat(state.cat);
        state.idx = 0;
        state.stage = 0;
        buildCats();
        render();
      }
      function setStats() {
        const ok = Object.values(state.marks).filter((v) => v === "ok").length;
        const no = Object.values(state.marks).filter((v) => v === "no").length;
        document.getElementById("s-ok").textContent = ok;
        document.getElementById("s-no").textContent = no;
        document.getElementById("s-pos").textContent = Math.min(
          state.idx + 1,
          state.order.length,
        );
        document.getElementById("s-total").textContent = state.order.length;
        const pct = state.order.length
          ? (state.idx / state.order.length) * 100
          : 0;
        document.getElementById("bar").style.width = pct + "%";
      }
      function render() {
        const area = document.getElementById("cardArea");
        if (state.order.length === 0) {
          area.innerHTML = `<div class="card"><div class="done"><div class="big">🎉</div><h2>冇卡喇！</h2><p class="sub">呢個分類／「要溫」清單已清空。</p></div></div>`;
          setStats();
          return;
        }
        if (state.idx >= state.order.length) {
          const ok = Object.values(state.marks).filter(
            (v) => v === "ok",
          ).length;
          area.innerHTML = `<div class="card"><div class="done">
      <div class="big">🏆</div><h2>完成呢副牌！</h2>
      <p class="sub">已過 ${state.order.length} 張卡 · 標記識得 ${ok} 張</p>
      <div class="controls" style="margin-top:22px">
        <button class="btn ok" onclick="state.idx=0;state.stage=0;render()">↺ 再嚟一次</button>
        <button class="btn no" onclick="state.reviewMode=true;startDeck()">⚠️ 集中溫「要溫」</button>
      </div></div></div>`;
          setStats();
          return;
        }
        const it = DATA[state.order[state.idx]];
        const gi = state.order[state.idx];
        let layersHTML = "";
        LAYER_DEFS.forEach((L, li) => {
          const open = state.stage > li;
          const locked = state.stage < li;
          let val = "";
          if (L.key === "def") {
            const D = DEFS[it.d] || { def: "—", ji: "—" };
            val = `<div class="deftxt"><b>定義：</b>${D.def}</div><div class="ji"><b>總病機：</b>${D.ji}</div>`;
          }
          if (L.key === "f") val = `<div class="val">${it.f}</div>`;
          if (L.key === "r") val = `<div class="val">${it.r}</div>`;
          if (L.key === "yao") val = `<div class="compose">${it.m}</div>`;
          layersHTML += `<div class="layer ${L.cls} ${open ? "open" : ""} ${locked ? "locked" : ""}" data-li="${li}">
      <div class="lh"><span class="ico">${open ? "✓" : L.icon}</span>${L.title}${locked ? ' <span style="margin-left:auto;font-size:11px">🔒</span>' : ""}</div>
      <div class="body">${val}</div></div>`;
        });
        const fullyRevealed = state.stage >= LAYER_DEFS.length;
        const mark = state.marks[gi];
        area.innerHTML = `
    <div class="card" id="theCard">
      <span class="badge">${it.c}</span>
      <div class="disease">${it.d}</div>
      <div class="zheng">${it.z}</div>
      <div class="layers">${layersHTML}</div>
      ${!fullyRevealed ? `<div class="tap-hint">👆 撳卡／撳掣 逐層揭開</div>` : ``}
    </div>
    <div class="controls">
      ${
        !fullyRevealed
          ? `<button class="btn reveal" id="revealBtn">揭開：${LAYER_DEFS[state.stage].title} ▾</button>`
          : `<button class="btn no" id="markNo">⚠️ 要再溫</button>
           <button class="btn ok" id="markOk">✓ 識得</button>`
      }
    </div>
    <div class="nav">
      <button class="btn" onclick="prevCard()">◀ 上一張</button>
      <button class="btn" onclick="nextCard()">下一張 ▶</button>
    </div>`;

        // interactions
        const card = document.getElementById("theCard");
        card.onclick = (e) => {
          if (e.target.closest(".layer")) return;
          if (state.stage < LAYER_DEFS.length) {
            state.stage++;
            render();
          }
        };
        // allow clicking a revealed layer header to collapse-peek (toggle re-show) — keep simple: clicking locked does nothing
        card.querySelectorAll(".layer").forEach((el) => {
          el.querySelector(".lh").onclick = (ev) => {
            ev.stopPropagation();
            const li = +el.dataset.li;
            if (li === state.stage) {
              state.stage++;
              render();
            }
          };
        });
        const rb = document.getElementById("revealBtn");
        if (rb)
          rb.onclick = () => {
            state.stage++;
            render();
          };
        const mo = document.getElementById("markOk");
        if (mo)
          mo.onclick = () => {
            state.marks[gi] = "ok";
            nextCard();
          };
        const mn = document.getElementById("markNo");
        if (mn)
          mn.onclick = () => {
            state.marks[gi] = "no";
            nextCard();
          };
        setStats();
      }
      function nextCard() {
        state.idx++;
        state.stage = 0;
        render();
      }
      function prevCard() {
        if (state.idx > 0) {
          state.idx--;
          state.stage = 0;
          render();
        }
      }

      document.getElementById("t-shuffle").onclick = () => {
        shuffle(state.order);
        state.idx = 0;
        state.stage = 0;
        render();
      };
      document.getElementById("t-review").onclick = () => {
        const noCount = Object.values(state.marks).filter(
          (v) => v === "no",
        ).length;
        if (noCount === 0) {
          alert("仲未標記過「要再溫」嘅卡 😊");
          return;
        }
        state.reviewMode = true;
        startDeck();
      };
      document.getElementById("t-reset").onclick = () => {
        if (confirm("重新開始？會清除「識得／要溫」標記。")) {
          state.marks = {};
          state.reviewMode = false;
          startDeck();
        }
      };

      // keyboard
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " ") {
          if (state.stage < LAYER_DEFS.length) {
            state.stage++;
            render();
          } else nextCard();
          e.preventDefault();
        } else if (e.key === "ArrowLeft") {
          prevCard();
        }
      });

      buildCats();
      startDeck();
    </script>
  </body>
</html>
