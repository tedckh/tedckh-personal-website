<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內科證型方藥記憶卡 · 執業試溫習遊戲</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2230; --panel2:#222d40; --line:#2e3b52;
    --txt:#e7eef7; --muted:#94a3b8; --accent:#ff7a59; --accent2:#5ec1a8;
    --gold:#f5c451; --blue:#5aa9e6; --purple:#b794f6; --red:#f06a6a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1c2737,#0f1419 60%);color:var(--txt);min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
  header{text-align:center;padding:8px 0 4px}
  h1{font-size:22px;margin:0;letter-spacing:1px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}

  .stats{display:flex;gap:8px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--muted)}
  .chip b{color:var(--gold);font-size:15px}
  .chip.ok b{color:var(--accent2)} .chip.no b{color:var(--red)}

  .cats{display:flex;gap:6px;overflow-x:auto;padding:10px 2px;margin-bottom:6px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:18px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
  .cat.active{background:linear-gradient(135deg,var(--accent),#ff9a76);color:#1a1209;border-color:transparent;font-weight:700}

  .progress{height:6px;background:var(--panel);border-radius:6px;overflow:hidden;margin:6px 2px 14px}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--blue));width:0;transition:.3s}

  .card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);padding:22px 20px;min-height:380px;
    display:flex;flex-direction:column;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 80% 0%,rgba(255,122,89,.08),transparent 60%);pointer-events:none}
  .badge{align-self:flex-start;font-size:12px;color:var(--muted);background:#0e1622;border:1px solid var(--line);
    border-radius:14px;padding:4px 10px;margin-bottom:4px}
  .disease{font-size:30px;font-weight:800;letter-spacing:1px;margin:6px 0 2px}
  .zheng{font-size:20px;color:var(--gold);font-weight:700;margin-bottom:2px}
  .layers{margin-top:14px;display:flex;flex-direction:column;gap:12px;flex:1}

  .layer{border-radius:14px;border:1px dashed var(--line);background:#0e1622aa;overflow:hidden;transition:.2s}
  .layer .lh{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:13px;color:var(--muted);cursor:pointer}
  .layer .lh .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
    background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .layer .body{padding:0 14px;max-height:0;opacity:0;transition:max-height .35s ease,opacity .25s,padding .25s}
  .layer.open{border-style:solid}
  .layer.open .body{max-height:400px;opacity:1;padding:0 14px 14px}
  .layer.open .lh{color:var(--txt)}
  .layer.open .ico{background:var(--accent2);border-color:transparent;color:#06231b}
  .layer.locked{opacity:.45}
  .layer.locked .lh{cursor:not-allowed}

  .l-def.open{box-shadow:inset 0 0 0 1px var(--purple)}
  .l-def .deftxt{font-size:15px;line-height:1.75}
  .l-def .deftxt b{color:var(--purple)}
  .l-def .ji{margin-top:8px;font-size:15px;line-height:1.75}
  .l-def .ji b{color:var(--accent2)}
  .l-zhifa.open{box-shadow:inset 0 0 0 1px var(--blue)}
  .l-zhifa .val{font-size:19px;color:var(--blue);font-weight:700}
  .l-fang.open{box-shadow:inset 0 0 0 1px var(--accent)}
  .l-fang .val{font-size:24px;color:var(--accent);font-weight:800;letter-spacing:1px}
  .l-yao .compose{font-size:16px;line-height:1.7}

  .tap-hint{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

  .controls{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:active{transform:scale(.97)}
  .btn.reveal{background:linear-gradient(135deg,var(--accent),#ff9a76);color:#1a1209}
  .btn.no{background:#3a2330;color:var(--red);border:1px solid #5a2f3f}
  .btn.ok{background:#1f3a32;color:var(--accent2);border:1px solid #2f5a4d}
  .nav{display:flex;gap:10px;margin-top:10px}
  .nav .btn{background:var(--panel);color:var(--muted);border:1px solid var(--line);font-size:14px;padding:11px}

  .toolbar{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .tool{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:12px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .tool:active{background:var(--panel)}

  .done{text-align:center;padding:40px 20px}
  .done .big{font-size:46px;margin-bottom:8px}
  .done h2{margin:6px 0}
  footer{text-align:center;color:#5b6677;font-size:11px;margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>內科證型方藥 · 記憶卡</h1>
    <div class="sub">香港中醫執業試溫習 · 第五版教材為準 · 逐層翻牌</div>
  </header>

  <div class="stats">
    <span class="chip">進度 <b id="s-pos">0</b>/<span id="s-total">0</span></span>
    <span class="chip ok">識得 <b id="s-ok">0</b></span>
    <span class="chip no">要溫 <b id="s-no">0</b></span>
  </div>

  <div class="cats" id="cats"></div>
  <div class="progress"><i id="bar"></i></div>

  <div id="cardArea"></div>

  <div class="toolbar">
    <button class="tool" id="t-shuffle">🔀 隨機洗牌</button>
    <button class="tool" id="t-review">⚠️ 只溫「要溫」</button>
    <button class="tool" id="t-reset">↺ 重新開始</button>
  </div>

  <footer>
    內容依《中醫內科學》第五版規劃教材整理。<br>
    臨證以教材原文為準；如有疑問請核對課本。祝 Alex 考試順利 🌿
  </footer>
</div>

/* ---------- 病的定義 & 總病機（按病名對應） ---------- */
const DEFS={
"感冒":{def:"感受觸冒風邪，邪犯衛表而致病，以鼻塞、流涕、噴嚏、咳嗽、頭痛、惡寒、發熱、全身不適、脈浮為特徵。時行感冒呈流行性，症狀較重。",ji:"六淫病邪或時行病毒侵襲人體，衛表不和，肺失宣肅。"},
"咳嗽":{def:"肺失宣降，肺氣上逆作聲，咳吐痰液的病證。有聲無痰為咳，有痰無聲為嗽，一般痰聲並見，難以截然分開。",ji:"外感咳嗽為六淫外邪犯肺；內傷咳嗽為臟腑功能失調、內邪干肺。總由肺失宣肅，肺氣上逆。"},
"哮證":{def:"發作性的痰鳴氣喘疾患，發時喉中哮鳴有聲，呼吸氣促困難，甚則喘息不能平臥。",ji:"宿痰伏肺，遇誘因引觸，痰阻氣道，氣道攣急，肺失肅降，痰氣搏擊而致哮鳴。"},
"喘證":{def:"以呼吸困難，甚至張口抬肩、鼻翼煽動、不能平臥為特徵的病證。",ji:"實喘在肺，為邪壅肺氣，宣降不利；虛喘責之肺腎，因精氣不足，肺腎出納失常。"},
"肺癰":{def:"肺葉生瘡，形成膿瘍的病證，屬內癰之一。以咳嗽、胸痛、發熱、咯吐腥臭濁痰甚則膿血相兼為主症。",ji:"風熱火毒壅滯於肺，熱壅血瘀，蘊毒化膿而成癰。"},
"肺癆":{def:"具有傳染性的慢性虛弱疾患，以咳嗽、咯血、潮熱、盜汗及身體逐漸消瘦為主要特徵。",ji:"癆蟲蝕肺，耗傷肺陰，陰虛火旺；繼則氣陰兩傷，甚則陰損及陽。"},
"肺脹":{def:"多種慢性肺系疾患反覆發作、遷延不愈，致肺氣脹滿不能斂降，以胸部膨滿、憋悶如塞、喘息上氣、咳嗽痰多、煩躁心悸為主症。",ji:"久病肺虛，痰瘀瀦留，肺不斂降，氣還肺間；每因復感外邪誘使病情發作加劇，病及脾、腎、心。"},
"肺痿":{def:"肺葉痿弱不用，以咳吐濁唾涎沫為主症的慢性虛損性疾患。",ji:"肺燥津傷或肺氣虛冷，肺失濡養，肺葉枯萎。"},
"心悸":{def:"病人自覺心中悸動、驚惕不安，甚則不能自主的病證，包括驚悸與怔忡，多呈陣發性，常因情緒波動或勞累而誘發。",ji:"氣血陰陽虧虛，心失所養；或痰飲瘀血阻滯，心脈不暢，心神不寧。"},
"胸痹":{def:"以胸部悶痛，甚則胸痛徹背、短氣喘息不得臥為主症的病證。輕者胸悶如窒，重者心痛徹背、背痛徹心。",ji:"上焦陽虛，陰寒、痰濁、瘀血等痹阻胸陽，心脈不通；本虛標實之證。"},
"不寐":{def:"經常不能獲得正常睡眠的病證。輕者入寐困難、寐而易醒、醒後不能再寐，重者整夜不能入寐，亦稱不得眠、目不瞑。",ji:"陽盛陰衰，陰陽失交，心神不安。"},
"厥證":{def:"以突然昏倒、不省人事、四肢厥冷為主要表現的病證，醒後無偏癱、失語、口眼喎斜等後遺症。",ji:"氣機逆亂，升降乖戾，氣血陰陽不相順接。"},
"癇證":{def:"發作性神志異常疾病，又名癲癇、羊癇風。突然昏仆、口吐涎沫、肢體抽搐、移時自醒，醒後一如常人。",ji:"痰濁內伏，遇誘因引觸，痰隨氣逆，蒙蔽清竅，竄擾經絡。"},
"胃痛":{def:"以上腹胃脘部近心窩處經常發生疼痛為主症的病證，又稱胃脘痛。",ji:"胃氣鬱滯，胃失和降，不通則痛。"},
"嘔吐":{def:"胃失和降，氣逆於上，迫使胃中之物從口中吐出的病證。有物有聲為嘔，有物無聲為吐。",ji:"胃失和降，胃氣上逆。"},
"呃逆":{def:"胃氣上逆動膈，以氣逆上沖、喉間呃呃連聲、聲短而頻、難以自制為主要表現，古稱噦。",ji:"胃失和降，胃氣上逆動膈。"},
"噎膈":{def:"噎為吞咽之時梗噎不順；膈為格拒，飲食不下，或食入即吐。噎屬膈之始，膈乃噎之漸。",ji:"痰、氣、瘀交阻食道，通降失常；繼則津枯血燥，食道狹窄乾澀。"},
"腹痛":{def:"胃脘以下、恥骨毛際以上的部位發生疼痛為主症的病證。",ji:"臟腑氣機阻滯，氣血運行不暢，經脈痹阻，不通則痛；或臟腑經脈失養，不榮則痛。"},
"泄瀉":{def:"排便次數增多，糞質稀溏，甚至瀉出如水樣的病證。大便溏薄為溏泄，如水傾注為水瀉。",ji:"脾虛濕盛，脾胃運化失健，小腸無以分清泌濁，大腸傳導失司。"},
"痢疾":{def:"以大便次數增多、腹痛、裡急後重、下痢赤白膿血為主證，多發於夏秋季，具強烈傳染性的腸道疾病。",ji:"邪蘊腸腑，氣血壅滯，傳導失司，脂絡受傷，腐敗化為膿血。"},
"便秘":{def:"大便秘結不通，排便時間延長，或欲大便而艱澀不暢的病證。",ji:"大腸傳導功能失常，與脾胃肝腎相關——熱結、氣滯、氣血陰陽虧虛、陰寒凝滯所致。"},
"脅痛":{def:"以一側或兩側脅肋疼痛為主要表現的病證。",ji:"肝絡失和——氣滯、血瘀、濕熱致肝膽疏泄不利（不通則痛），或肝陰不足、絡脈失養（不榮則痛）。"},
"黃疸":{def:"以身黃、目黃、小便黃為主症的病證，其中目睛黃染為主要特徵。分陽黃、陰黃、急黃。",ji:"濕邪困遏脾胃，壅塞肝膽，疏泄失常，膽汁泛溢肌膚。"},
"積聚":{def:"腹內結塊，或痛或脹的病證。積屬有形，固定不移，痛有定處，病在血分，乃為臟病；聚屬無形，聚散無常，痛無定處，病在氣分，乃為腑病。",ji:"氣機阻滯，瘀血內結；聚證以氣滯為主，積證以血瘀為主。"},
"鼓脹":{def:"腹部脹大如鼓的病證，以腹大脹滿、繃急如鼓、皮色蒼黃、脈絡顯露為特徵。",ji:"肝脾腎三臟受損，氣滯、血瘀、水停腹中。"},
"頭痛":{def:"病人自覺頭部疼痛的病證，由外感與內傷致脈絡絀急或失養，清竅不利所引起。",ji:"外感者風邪上犯清竅；內傷者肝陽、痰濁、瘀血上擾，或氣血精髓虧虛，腦失所養。"},
"眩暈":{def:"眩是眼花，暈是頭暈，二者常同時並見。輕者閉目即止，重者如坐車船、旋轉不定、不能站立，或伴噁心嘔吐。",ji:"肝陽上亢、氣血虧虛、腎精不足、痰濁中阻。「諸風掉眩，皆屬於肝」、「無虛不作眩」、「無痰不作眩」。"},
"中風":{def:"卒然昏仆、不省人事，伴口眼喎斜、半身不遂、語言不利，或不經昏仆而僅以喎僻不遂為主症的疾病。",ji:"陰陽失調，氣血逆亂，上犯於腦；風、火、痰、瘀為主要病理因素，病位淺深分中經絡與中臟腑。"},
"痙證":{def:"以項背強直、四肢抽搐，甚至口噤、角弓反張為主症的病證。",ji:"陰虛血少，筋脈失養，虛風內動；或邪壅經絡，氣血運行不利，筋脈拘急。"},
"水腫":{def:"體內水液瀦留，氾濫肌膚，以頭面、眼瞼、四肢、腹背甚至全身浮腫為特徵的病證，分陽水、陰水。",ji:"肺失通調、脾失轉輸、腎失開合，膀胱氣化不利，水液瀦留氾濫肌膚。"},
"淋證":{def:"小便頻數短澀，滴瀝刺痛，欲出未盡，小腹拘急，或痛引腰腹的病證。分熱、石、氣、血、膏、勞六淋。",ji:"濕熱蘊結下焦，膀胱氣化不利；久則由實轉虛，脾腎兩虧。"},
"癃閉":{def:"以小便量少、排尿困難，甚則小便閉塞不通為主症的病證。癃為小便不暢、點滴而短少；閉為小便閉塞、點滴全無。",ji:"膀胱氣化功能失調，三焦氣化不利，與肺脾腎肝相關。"},
"腰痛":{def:"以腰部一側或兩側疼痛為主症的病證。腰為腎之府。",ji:"外邪痹阻經脈，氣血運行不暢；或腎虛腰府失養。"},
"遺精":{def:"不因性生活而精液遺泄的病證。有夢而遺為夢遺，無夢而遺、甚至清醒時精液自流為滑精。",ji:"君相火旺擾動精室；或濕熱下注；或腎虛封藏失職，精關不固。"},
"鬱證":{def:"由情志不舒、氣機鬱滯引起的病證，以心情抑鬱、情緒不寧、脅肋脹痛、易怒善哭、咽中如有異物梗塞、失眠為主要表現。",ji:"肝失疏泄，脾失健運，心失所養，臟腑陰陽氣血失調。"},
"血證·鼻衄":{def:"血液不循常道上溢於鼻竅而出血，是血證中常見的一種。血證泛指血液不循常道，上溢於口鼻諸竅、下泄於前後二陰、滲出於肌膚的疾患。",ji:"火熱迫血妄行（肺熱、胃火、肝火），或氣虛不攝，血溢脈外。"},
"血證·齒衄":{def:"齒齦出血，又稱牙衄、牙宣，屬血證之一。",ji:"胃火熾盛，循經上犯；或陰虛火旺，虛火上炎，灼傷齦絡。"},
"血證·咳血":{def:"血由肺及氣道而來，經咳嗽而出，痰中帶血，或痰血相兼，或純血鮮紅、間夾泡沫。",ji:"火熱灼傷肺絡（燥熱、肝火），或陰虛肺熱，肺絡受損。"},
"血證·吐血":{def:"血由胃而來，經嘔吐而出，血色紅或紫黯，常夾有食物殘渣，又稱嘔血。",ji:"胃熱壅盛、肝火犯胃，熱迫血行；或氣虛不攝，血溢脈外。"},
"血證·便血":{def:"血自肛門排出，大便帶血，或全為血便，色鮮紅、暗紅或紫黯如柏油樣。",ji:"腸道濕熱，灼傷脈絡；或脾胃虛寒、氣虛不攝，血溢腸內。"},
"血證·尿血":{def:"小便中混有血液甚至血塊，排尿不痛或痛感不顯（痛者為血淋）。",ji:"熱傷脈絡（實熱、虛火），或脾腎不固，血滲膀胱。"},
"血證·紫斑":{def:"血液溢出肌膚之間，皮膚表現青紫斑點或斑塊，又稱肌衄、葡萄疫。",ji:"血熱妄行、陰虛火旺，迫血外溢；或氣不攝血，血溢肌腠。"},
"痰飲":{def:"體內水液輸布運化失常，停積於某些部位的一類病證。飲停腸胃為痰飲，水流脅下為懸飲，飲溢肢體為溢飲，支撐胸肺為支飲。",ji:"中陽素虛，臟氣不足，三焦氣化失宣，肺脾腎對津液的通調轉輸蒸化失職，水液停積為飲。"},
"汗證":{def:"陰陽失調、腠理不固而致汗液外泄失常的病證。白晝時時汗出、動則益甚為自汗；寐中汗出、醒來自止為盜汗。",ji:"陰陽失調，腠理不固，營衛失和，汗液外泄失常。自汗多屬氣虛不固，盜汗多屬陰虛內熱。"},
"消渴":{def:"以多尿、多飲、多食、乏力、消瘦，或尿有甜味為主要臨床表現的疾病，分上、中、下三消。",ji:"陰津虧損，燥熱偏盛；陰虛為本，燥熱為標。病變臟腑主要在肺、胃、腎，以腎為關鍵。"},
"虛勞":{def:"又稱虛損，是以臟腑虧損、氣血陰陽不足為主要病機的多種慢性衰弱證候的總稱。",ji:"五臟虧損，氣血陰陽不足。辨證以氣、血、陰、陽為綱，五臟虛候為目。"},
"痹證":{def:"風寒濕熱之邪侵襲人體，氣血凝滯，閉阻經絡，留著關節，出現肌肉筋骨關節痠痛、麻木、重著、屈伸不利，甚至關節腫大灼熱變形的病證。",ji:"風寒濕熱之邪痹阻經絡關節，氣血運行不暢。風勝為行痹，寒勝為痛痹，濕勝為著痹，熱勝為熱痹。"}
};

/* ---------- 遊戲邏輯 ---------- */
const LAYER_DEFS=[
  {key:"def", cls:"l-def", icon:"義", title:"定義 · 總病機"},
  {key:"f", cls:"l-zhifa", icon:"治", title:"治法"},
  {key:"r", cls:"l-fang",  icon:"方", title:"用方"},
  {key:"yao", cls:"l-yao", icon:"藥", title:"藥物組成"}
];
const cats = ["全部", ...Array.from(new Set(DATA.map(x=>x.c)))];
let state = { cat:"全部", order:[], idx:0, stage:0, marks:{}, reviewMode:false };

function indicesForCat(cat){
  let arr = DATA.map((x,i)=>i).filter(i=> cat==="全部" || DATA[i].c===cat);
  if(state.reviewMode) arr = arr.filter(i=> state.marks[i]==="no");
  return arr;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildCats(){
  const wrap=document.getElementById("cats"); wrap.innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="cat"+(c===state.cat?" active":"");
    const n = c==="全部"?DATA.length:DATA.filter(x=>x.c===c).length;
    b.textContent=`${c}·${n}`;
    b.onclick=()=>{state.cat=c;state.reviewMode=false;startDeck();};
    wrap.appendChild(b);
  });
}
function startDeck(){
  state.order = indicesForCat(state.cat);
  state.idx=0; state.stage=0;
  buildCats(); render();
}
function setStats(){
  const ok=Object.values(state.marks).filter(v=>v==="ok").length;
  const no=Object.values(state.marks).filter(v=>v==="no").length;
  document.getElementById("s-ok").textContent=ok;
  document.getElementById("s-no").textContent=no;
  document.getElementById("s-pos").textContent=Math.min(state.idx+1,state.order.length);
  document.getElementById("s-total").textContent=state.order.length;
  const pct=state.order.length? (state.idx/state.order.length*100):0;
  document.getElementById("bar").style.width=pct+"%";
}
function render(){
  const area=document.getElementById("cardArea");
  if(state.order.length===0){
    area.innerHTML=`<div class="card"><div class="done"><div class="big">🎉</div><h2>冇卡喇！</h2><p class="sub">呢個分類／「要溫」清單已清空。</p></div></div>`;
    setStats(); return;
  }
  if(state.idx>=state.order.length){
    const ok=Object.values(state.marks).filter(v=>v==="ok").length;
    area.innerHTML=`<div class="card"><div class="done">
      <div class="big">🏆</div><h2>完成呢副牌！</h2>
      <p class="sub">已過 ${state.order.length} 張卡 · 標記識得 ${ok} 張</p>
      <div class="controls" style="margin-top:22px">
        <button class="btn ok" onclick="state.idx=0;state.stage=0;render()">↺ 再嚟一次</button>
        <button class="btn no" onclick="state.reviewMode=true;startDeck()">⚠️ 集中溫「要溫」</button>
      </div></div></div>`;
    setStats(); return;
  }
  const it=DATA[state.order[state.idx]];
  const gi=state.order[state.idx];
  let layersHTML="";
  LAYER_DEFS.forEach((L,li)=>{
    const open = state.stage>li;
    const locked = state.stage<li;
    let val="";
    if(L.key==="def"){
      const D=DEFS[it.d]||{def:"—",ji:"—"};
      val=`<div class="deftxt"><b>定義：</b>${D.def}</div><div class="ji"><b>總病機：</b>${D.ji}</div>`;
    }
    if(L.key==="f") val=`<div class="val">${it.f}</div>`;
    if(L.key==="r") val=`<div class="val">${it.r}</div>`;
    if(L.key==="yao") val=`<div class="compose">${it.m}</div>`;
    layersHTML+=`<div class="layer ${L.cls} ${open?'open':''} ${locked?'locked':''}" data-li="${li}">
      <div class="lh"><span class="ico">${open?'✓':L.icon}</span>${L.title}${locked?' <span style="margin-left:auto;font-size:11px">🔒</span>':''}</div>
      <div class="body">${val}</div></div>`;
  });
  const fullyRevealed = state.stage>=LAYER_DEFS.length;
  area.innerHTML=`
    <div class="card" id="theCard">
      <span class="badge">${it.c}</span>
      <div class="disease">${it.d}</div>
      <div class="zheng">${it.z}</div>
      <div class="layers">${layersHTML}</div>
      ${!fullyRevealed?`<div class="tap-hint">👆 撳卡／撳掣 逐層揭開</div>`:``}
    </div>
    <div class="controls">
      ${!fullyRevealed
        ? `<button class="btn reveal" id="revealBtn">揭開：${LAYER_DEFS[state.stage].title} ▾</button>`
        : `<button class="btn no" id="markNo">⚠️ 要再溫</button>
           <button class="btn ok" id="markOk">✓ 識得</button>`}
    </div>
    <div class="nav">
      <button class="btn" onclick="prevCard()">◀ 上一張</button>
      <button class="btn" onclick="nextCard()">下一張 ▶</button>
    </div>`;

  const card=document.getElementById("theCard");
  card.onclick=(e)=>{ if(e.target.closest('.layer')) return; if(state.stage<LAYER_DEFS.length){state.stage++;render();} };
  card.querySelectorAll('.layer').forEach(el=>{
    el.querySelector('.lh').onclick=(ev)=>{ev.stopPropagation();
      const li=+el.dataset.li;
      if(li===state.stage){state.stage++;render();}
    };
  });
  const rb=document.getElementById("revealBtn"); if(rb) rb.onclick=()=>{state.stage++;render();};
  const mo=document.getElementById("markOk"); if(mo) mo.onclick=()=>{state.marks[gi]="ok";nextCard();};
  const mn=document.getElementById("markNo"); if(mn) mn.onclick=()=>{state.marks[gi]="no";nextCard();};
  setStats();
}
function nextCard(){ state.idx++; state.stage=0; render(); }
function prevCard(){ if(state.idx>0){state.idx--; state.stage=0; render();} }

document.getElementById("t-shuffle").onclick=()=>{shuffle(state.order);state.idx=0;state.stage=0;render();};
document.getElementById("t-review").onclick=()=>{
  const noCount=Object.values(state.marks).filter(v=>v==="no").length;
  if(noCount===0){alert("仲未標記過「要再溫」嘅卡 😊");return;}
  state.reviewMode=true; startDeck();
};
document.getElementById("t-reset").onclick=()=>{
  if(confirm("重新開始？會清除「識得／要溫」標記。")){state.marks={};state.reviewMode=false;startDeck();}
};

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "){
    if(state.stage<LAYER_DEFS.length){state.stage++;render();}else nextCard(); e.preventDefault();
  }else if(e.key==="ArrowLeft"){prevCard();}
});

buildCats(); startDeck();
</script>
</body>
</html>
